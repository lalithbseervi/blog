<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }}</title>
</head>
<body>
    <h1>{{ name }}</h1>
    <p> {{ name }} {{ rel }} </p>
    {% for attr in attributes %}
        <p>{{ attr.key }}: {{ attr.value }} </p>
    {% endfor %}
</body>
</html>
