<div class="copy-this">
    <button id="#ctc" data-copy-btn="buttonCopy" data-copy-url="{{ copy_url }}" class="{{ link_class }}"> {{ link_text }}</button>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        btn = document.getElementById('#ctc');
        btn.style.backgroundColor = '#212121'; 
        btn.style.border = '0'; 
        btn.style.color = '#ffb300'; 
        btn.style.textDecoration = 'underline #ffb300' 
    })
</script>
