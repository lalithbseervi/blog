{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv = "Content-Type" content = "text / html; charset = utf-8" />
    <meta name='robots' content='noindex,follow' />
    <title>Edit {{ blog_post.title }}</title>
    <link rel="stylesheet" href="{% static 'simple.css' %}">
    <script type="text/javascript" src="{% static 'tinymce/tinymce.min.js' %}"></script>
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgo=">
    <style>
        .mce-container {
            max-width: 100%;      /* Prevent the editor from going beyond the container */
            width: 100%;          /* Make sure it fills the available space */
            height: auto;         /* Let the height adjust based on content */
        }
    
        /* Optional: Adjust height based on screen size */
        @media (max-width: 768px) {
            .mce-container {
                height: 300px;  /* Adjust height for smaller screens */
            }
        }
    
        @media (max-width: 480px) {
            .mce-container {
                height: 250px;  /* Further adjust for very small screens */
            }
        }
    </style>
</head>
<body id="#body">
    <form method = "post" action = ".">
        {% csrf_token %}
        {{ form.media }}
        {{ form.as_p }}
        <p> <input type="submit" value="Edit Post"> </p>
    </form>
</body>
</html>
