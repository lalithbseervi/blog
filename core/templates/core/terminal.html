<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name='robots' content='noindex,follow' />
    <title>Terminal Emulation</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery.terminal@2.x.x/js/jquery.terminal.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jquery.terminal@2.x.x/css/jquery.terminal.min.css" />
    <style>
        .terminal {
            --size: 1.1;
        }
    </style>
</head>
<body>
<script type="text/javascript">
    var ip = "{{IP}}"
    jQuery(function($) {
      $('html').terminal(function(cmd, term) {
        if (cmd == '/fetch/') {
          term.read("Enter the six digit code: ", code => {
                window.location.href = window.location.origin + '/home/?ref=' + code;
          });
        }
        else if(cmd == 'help') {
            term.echo("available commands are: \npwd\nhelp\nclear\nip\ncontinue");
        }
        else if(cmd == 'continue') {
            term.read("Enter the code you received: ", code => {
                window.location.href = window.location.origin + '/fetch/?code_inp=' + code;
            });
        }
        else if(cmd == 'ip') {
            term.echo("Your IP: " + ip);
        }
        else if(cmd == 'pwd') {
            term.echo("/fetch/");
        }
        else {
            term.echo("inccorect command or intrusion detected. alert sent. ref: " + command);
        }},
        {
            greetings: "use the `help` command to see all available commands"
        });});
</script>
</body>
</html>
